[build]
  # Directory with VitePress content
  base = "."
  
  # Build command
  command = "pnpm install --frozen-lockfile && pnpm build && pnpm docs:build"
  
  # Output directory (VitePress builds to docs/.vitepress/dist)
  publish = "docs/.vitepress/dist"

[build.environment]
  # Use Node.js 18 or higher
  NODE_VERSION = "24"

# VitePress generates real HTML pages and its own 404 page.

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
